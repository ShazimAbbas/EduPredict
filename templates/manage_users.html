{% extends 'base.html' %}{% block content %}
<section class="hero">
  <div>
    <p class="eyebrow">ADMINISTRATION</p>
    <h1>User management</h1>
    <p>Manage platform accounts and permissions.</p>
  </div>
</section>
<section class="panel">
  <h2>Add user</h2>
  <form class="add-user" method="post" action="{{ url_for('add_user') }}">
    <label>Name<input name="name" required /></label
    ><label>Email<input type="email" name="email" required /></label
    ><label
      >Password<input
        type="password"
        name="password"
        minlength="8"
        required /></label
    ><label
      >Role<select name="role">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select></label
    ><button>Add user</button>
  </form>
</section>
<section class="panel">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Update</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for user in all_users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge neutral">{{ user.role }}</span></td>
          <td>
            <form
              class="inline"
              method="post"
              action="{{ url_for('update_role', user_id=user._id) }}"
            >
              <select name="role">
                {% for role in ['admin','teacher','student'] %}
                <option
                  value="{{ role }}"
                  {%
                  if
                  role=""
                  ="user.role"
                  %}selected{%
                  endif
                  %}
                >
                  {{ role.title() }}
                </option>
                {% endfor %}</select
              ><button class="small">Save</button>
            </form>
          </td>
          <td>
            <form
              method="post"
              action="{{ url_for('delete_user', user_id=user._id) }}"
            >
              <button
                class="small danger-btn"
                {%
                if
                user.email=""
                ="current_user.email"
                %}disabled{%
                endif
                %}
              >
                Delete
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
