{% extends 'base.html' %}{% block title %}Sign in · EduPredict{% endblock %}{%
block content %}
<section class="auth-card">
  <p class="eyebrow">EDUCATIONAL INTELLIGENCE</p>
  <h1>Welcome back</h1>
  <p>Sign in to your EduPredict workspace.</p>
  <form method="post">
    <label
      >Email<input
        type="email"
        name="email"
        required
        autocomplete="email" /></label
    ><label
      >Password<input
        type="password"
        name="password"
        required
        autocomplete="current-password" /></label
    ><button>Sign in</button>
  </form>
  <br />
  <p class="muted">
    New here? <a href="{{ url_for('signup') }}">Create a student account</a>
  </p>
</section>
{% endblock %}
